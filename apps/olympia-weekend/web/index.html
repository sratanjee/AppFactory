<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Unofficial fan guide for Olympia Weekend 2026 in Las Vegas.">

  <!-- iOS Safari install support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Olympia Weekend">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Locked to Option B (mrolympia.com palette). Matches
       lib/design_tokens.dart's OlympiaColors.dark. -->
  <meta name="theme-color" content="#0e0e0e">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Type — Barlow Condensed for hero display (title / cardTitle), Inter
       for body. Loaded from Google Fonts on web; mobile falls back to
       system fonts until google_fonts is wired in post-store-submission.
       Weights match design_tokens.dart usage (Barlow 700; Inter 400/500/600). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <title>Olympia Weekend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Purge any prior Flutter service worker + cache before bootstrap runs.
       Flutter's default SW ships a "self-nuke" script that calls
       client.navigate() on activate, which causes a reload loop for any
       visitor who had an older SW registered. We unregister everything,
       drop all Cache Storage entries, THEN load flutter_bootstrap.js. -->
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (e) {
        console.warn('SW/cache purge failed (continuing):', e);
      }
      const s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
