name: factory_core
description: Shared Flutter package for factory apps — adaptive UI, onboarding, paywall, storage, analytics, widget bridge, Shorebird, l10n.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.4 <3.48.0"

dependencies:
  cupertino_icons: ^1.0.9
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: any
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  posthog_flutter: ^5.44.1
  purchases_flutter: ^10.13.1
  shorebird_code_push: ^2.0.7

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.4.0
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FactoryCorePlugin
      android:
        package: com.appfactory.factory_core
        pluginClass: FactoryCorePlugin
